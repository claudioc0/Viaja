<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIAJA — Protótipo Interativo (Mobile &amp; Web Admin)</title>
  <style>
    :root {
      --brand: #1d4ed8;
      --brand-hover: #1e40af;
      --brand-soft: #eff6ff;
      --bg: #f8fafc;
      --card: #ffffff;
      --surface-alt: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --success: #10b981;
      --success-soft: #ecfdf5;
      --warning: #f59e0b;
      --warning-soft: #fffbeb;
      --danger: #ef4444;
      --danger-soft: #fef2f2;
      --occupied: #cbd5e1;
      --radius: 14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
    }
    button, input, select { font-family: inherit; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* Top bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.02em;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
    }
    .pill-group {
      display: inline-flex;
      background: var(--surface-alt);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      gap: 4px;
    }
    .pill-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .pill-btn.active {
      background: var(--card);
      color: var(--brand);
      box-shadow: 0 1px 2px rgba(15,23,42,0.08);
    }

    .container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Stepper */
    .stepper {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .step-chip {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .step-chip.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    /* Mobile Shell */
    .mobile-layout {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 28px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .mobile-layout { grid-template-columns: 1fr; justify-items: center; }
    }
    .phone-frame {
      width: 390px;
      min-height: 720px;
      background: var(--bg);
      border: 10px solid #0f172a;
      border-radius: 38px;
      box-shadow: 0 20px 45px rgba(15,23,42,0.14);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .phone-status {
      background: #0f172a;
      color: #fff;
      font-size: 11px;
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
    }
    .phone-header {
      background: var(--card);
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .phone-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .phone-nav {
      background: var(--card);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 10px 8px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }
    .phone-nav button {
      background: none;
      border: none;
      color: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .phone-nav button.active { color: var(--brand); }

    /* Shared UI primitives */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
    .input {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      background: var(--card);
      color: var(--text);
      width: 100%;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.15s;
    }
    .btn-primary { background: var(--brand); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--brand-hover); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-outline {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #fecaca;
      padding: 6px 10px;
      font-size: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
    }
    .badge-success { background: var(--success-soft); color: #047857; }
    .badge-warning { background: var(--warning-soft); color: #b45309; }
    .badge-danger { background: var(--danger-soft); color: #b91c1c; }
    .badge-info { background: var(--brand-soft); color: var(--brand); }

    /* Bus Seat Grid */
    .bus-shell {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
    }
    .seat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr) 26px repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .seat-btn {
      height: 38px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid var(--success);
      background: var(--success-soft);
      color: #065f46;
    }
    .seat-btn.selected {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }
    .seat-btn.occupied {
      background: var(--surface-alt);
      border-color: var(--occupied);
      color: #94a3b8;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    /* Web Admin Shell */
    .admin-shell {
      display: grid;
      grid-template-columns: 230px 1fr;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      min-height: 640px;
      overflow: hidden;
    }
    .admin-sidebar {
      background: #0f172a;
      color: #cbd5e1;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .admin-nav-btn {
      border: none;
      background: transparent;
      color: #cbd5e1;
      text-align: left;
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
    }
    .admin-nav-btn.active { background: var(--brand); color: #fff; font-weight: 600; }
    .admin-main { padding: 24px; background: var(--bg); overflow-x: auto; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--border); }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: pulse 1.4s infinite;
      border-radius: 10px;
    }
    @keyframes pulse { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-logo">
      <div class="brand-mark">V</div>
      <div>
        VIAJA <span style="font-weight:400;color:var(--muted);font-size:13px;">Protótipo Fase 0</span>
      </div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <div class="pill-group">
        <button class="pill-btn active" id="mode-mobile" onclick="setPlatform('mobile')">App Mobile (Passageiro)</button>
        <button class="pill-btn" id="mode-web" onclick="setPlatform('web')">Painel Web (Admin)</button>
      </div>
      <div class="pill-group" title="Simular estados obrigatórios de UI">
        <button class="pill-btn active" id="state-normal" onclick="setUiState('normal')">Normal</button>
        <button class="pill-btn" id="state-loading" onclick="setUiState('loading')">Loading</button>
        <button class="pill-btn" id="state-empty" onclick="setUiState('empty')">Empty</button>
        <button class="pill-btn" id="state-error" onclick="setUiState('error')">Error</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="stepper" class="stepper"></div>
    <div id="viewport"></div>
  </main>

  <script>
    const state = {
      platform: 'mobile',
      uiState: 'normal',
      mobileScreen: 'search',
      webScreen: 'dashboard',
      authTab: 'login',
      origin: 'São Paulo, SP',
      destination: 'Rio de Janeiro, RJ',
      date: '2026-11-28',
      sortBy: 'price',
      selectedTripId: 't1',
      selectedSeats: ['13', '14'],
      paymentMethod: 'PIX',
      trips: [
        { id: 't1', company: 'Viaja Prime 104', cls: 'Executivo', dep: '08:00', arr: '14:00', dur: 360, price: 119.90, free: 18 },
        { id: 't2', company: 'Viaja Comfort 208', cls: 'Semi-Leito', dep: '13:30', arr: '19:15', dur: 345, price: 149.90, free: 9 },
        { id: 't3', company: 'Viaja Night 301', cls: 'Leito Plus', dep: '23:00', arr: '04:40', dur: 340, price: 199.00, free: 4 }
      ],
      occupiedSeats: ['01', '02', '05', '08', '11', '12', '19', '20', '24'],
      routes: [
        { id: 'R-01', origin: 'São Paulo, SP', destination: 'Rio de Janeiro, RJ', km: 435, dur: '6h 00m' },
        { id: 'R-02', origin: 'São Paulo, SP', destination: 'Curitiba, PR', km: 408, dur: '5h 40m' },
        { id: 'R-03', origin: 'São Paulo, SP', destination: 'Belo Horizonte, MG', km: 586, dur: '8h 00m' }
      ],
      reservations: [
        { code: 'VJ-8F4K92', user: 'Claudio Silva', trip: 'SP → RJ (08:00)', seats: '13, 14', total: 'R$ 239,80', pay: 'PIX · APPROVED', status: 'CONFIRMED' },
        { code: 'VJ-3M9P11', user: 'Mariana Costa', trip: 'SP → CWB (13:30)', seats: '07', total: 'R$ 134,90', pay: 'CARD · PENDING', status: 'PENDING' },
        { code: 'VJ-1A7Z04', user: 'Rafael Souza', trip: 'SP → BH (21:00)', seats: '21, 22', total: 'R$ 310,00', pay: 'PIX · REFUNDED', status: 'CANCELLED' }
      ]
    };

    const mobileSteps = [
      { id: 'auth', label: '1. Login / Cadastro' },
      { id: 'search', label: '2. Pesquisa' },
      { id: 'results', label: '3. Resultados' },
      { id: 'seats', label: '4. Seleção de Assentos' },
      { id: 'checkout', label: '5. Checkout' },
      { id: 'ticket', label: '6. Passagem Digital' }
    ];

    const webSteps = [
      { id: 'login', label: '1. Login Admin' },
      { id: 'dashboard', label: '2. Dashboard' },
      { id: 'routes', label: '3. Gerenciar Rotas' },
      { id: 'trips', label: '4. Gerenciar Viagens' },
      { id: 'reservations', label: '5. Consultar Reservas' }
    ];

    function setPlatform(p) {
      state.platform = p;
      document.getElementById('mode-mobile').classList.toggle('active', p === 'mobile');
      document.getElementById('mode-web').classList.toggle('active', p === 'web');
      render();
    }

    function setUiState(s) {
      state.uiState = s;
      ['normal', 'loading', 'empty', 'error'].forEach(k => {
        document.getElementById('state-' + k).classList.toggle('active', k === s);
      });
      render();
    }

    function toggleSeat(num) {
      if (state.occupiedSeats.includes(num)) return;
      const idx = state.selectedSeats.indexOf(num);
      if (idx >= 0) state.selectedSeats.splice(idx, 1);
      else if (state.selectedSeats.length < 4) state.selectedSeats.push(num);
      state.selectedSeats.sort();
      render();
    }

    function cancelReservation(code) {
      const item = state.reservations.find(r => r.code === code);
      if (item) {
        item.status = 'CANCELLED';
        item.pay = item.pay.split('·')[0] + '· REFUNDED';
        render();
      }
    }

    function renderStateFeedback() {
      if (state.uiState === 'loading') {
        return `
          <div class="card" style="display:flex;flex-direction:column;gap:10px;">
            <div class="skeleton" style="height:20px;width:55%;"></div>
            <div class="skeleton" style="height:68px;width:100%;"></div>
            <div class="skeleton" style="height:68px;width:100%;"></div>
          </div>`;
      }
      if (state.uiState === 'empty') {
        return `
          <div class="card" style="text-align:center;padding:32px 16px;">
            <div style="font-size:26px;margin-bottom:8px;">🚌</div>
            <div style="font-weight:700;margin-bottom:4px;">Nenhum registro encontrado</div>
            <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">Tente ajustar a data ou remover filtros aplicados.</p>
            <button class="btn btn-outline" onclick="setUiState('normal')">Limpar filtros</button>
          </div>`;
      }
      if (state.uiState === 'error') {
        return `
          <div class="card" style="border-color:#fecaca;background:var(--danger-soft);">
            <div style="font-weight:700;color:#b91c1c;margin-bottom:4px;">Falha ao sincronizar disponibilidade</div>
            <p style="font-size:13px;color:#991b1b;margin-bottom:12px;">Não foi possível consultar a API no momento. Verifique sua conexão.</p>
            <button class="btn btn-outline" onclick="setUiState('normal')">Tentar novamente</button>
          </div>`;
      }
      return null;
    }

    function renderMobileScreen() {
      const override = renderStateFeedback();
      if (override && ['results', 'seats', 'ticket'].includes(state.mobileScreen)) return override;

      const trip = state.trips.find(t => t.id === state.selectedTripId) || state.trips[0];
      const total = (state.selectedSeats.length * trip.price).toFixed(2).replace('.', ',');

      if (state.mobileScreen === 'auth') {
        return `
          <div class="card">
            <h2 style="font-size:19px;margin-bottom:4px;">Bem-vindo ao VIAJA</h2>
            <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">Sua jornada rodoviária simples e segura.</p>
            <div class="field"><label>E-mail</label><input class="input" value="passageiro@viaja.app" /></div>
            <div class="field"><label>Senha</label><input class="input" type="password" value="••••••••" /></div>
            <button class="btn btn-primary" onclick="state.mobileScreen='search';render()">Entrar na conta</button>
            <button class="btn btn-outline" style="width:100%;margin-top:8px;" onclick="state.mobileScreen='search';render()">Criar nova conta</button>
          </div>`;
      }

      if (state.mobileScreen === 'search') {
        return `
          <div class="card">
            <div style="font-size:12px;font-weight:700;color:var(--brand);margin-bottom:8px;">NOVA VIAGEM</div>
            <div class="field"><label>Origem</label><input class="input" value="${state.origin}" oninput="state.origin=this.value" /></div>
            <div class="field"><label>Destino</label><input class="input" value="${state.destination}" oninput="state.destination=this.value" /></div>
            <div class="field"><label>Data de ida</label><input class="input mono" type="date" value="${state.date}" /></div>
            <button class="btn btn-primary" style="margin-top:6px;" onclick="state.mobileScreen='results';render()">Pesquisar passagens</button>
          </div>
          <div class="card">
            <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;">TRECHOS POPULARES</div>
            <div style="font-size:13px;display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
              <span>São Paulo → Rio de Janeiro</span><span class="mono" style="color:var(--brand);font-weight:600;">R$ 119,90</span>
            </div>
            <div style="font-size:13px;display:flex;justify-content:space-between;padding:6px 0;">
              <span>São Paulo → Curitiba</span><span class="mono" style="color:var(--brand);font-weight:600;">R$ 109,90</span>
            </div>
          </div>`;
      }

      if (state.mobileScreen === 'results') {
        const sorted = [...state.trips].sort((a, b) =>
          state.sortBy === 'price' ? a.price - b.price :
          state.sortBy === 'dur' ? a.dur - b.dur : a.dep.localeCompare(b.dep)
        );
        return `
          <div style="display:flex;gap:6px;">
            <button class="step-chip ${state.sortBy==='price'?'active':''}" onclick="state.sortBy='price';render()">Menor preço</button>
            <button class="step-chip ${state.sortBy==='dur'?'active':''}" onclick="state.sortBy='dur';render()">Menor duração</button>
            <button class="step-chip ${state.sortBy==='dep'?'active':''}" onclick="state.sortBy='dep';render()">Horário</button>
          </div>
          ${sorted.map(t => `
            <div class="card" style="cursor:pointer;" onclick="state.selectedTripId='${t.id}';state.mobileScreen='seats';render()">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span style="font-size:12.5px;font-weight:700;">${t.company}</span>
                <span class="badge badge-info">${t.cls}</span>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;">
                <div class="mono" style="font-size:17px;font-weight:700;">${t.dep} → ${t.arr}</div>
                <div class="mono" style="font-size:17px;font-weight:800;color:var(--brand);">R$ ${t.price.toFixed(2).replace('.', ',')}</div>
              </div>
              <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted);">
                <span>Duração: ${Math.floor(t.dur/60)}h ${String(t.dur%60).padStart(2,'0')}m</span>
                <span style="color:var(--success);font-weight:600;">${t.free} livres</span>
              </div>
            </div>`).join('')}`;
      }

      if (state.mobileScreen === 'seats') {
        let gridHtml = '';
        for (let r = 0; r < 7; r++) {
          const base = r * 4;
          [1, 2, 0, 3, 4].forEach(offset => {
            if (offset === 0) {
              gridHtml += `<div style="display:grid;place-items:center;font-size:10px;color:var(--muted);">${r+1}</div>`;
            } else {
              const num = String(base + offset).padStart(2, '0');
              const isOcc = state.occupiedSeats.includes(num);
              const isSel = state.selectedSeats.includes(num);
              gridHtml += `<button class="seat-btn mono ${isOcc?'occupied':isSel?'selected':''}" onclick="toggleSeat('${num}')">${num}</button>`;
            }
          });
        }
        return `
          <div style="display:flex;justify-content:space-between;font-size:11.5px;">
            <span>🟢 Livre</span><span>🔵 Selecionado (${state.selectedSeats.length}/4)</span><span>⚪ Ocupado</span>
          </div>
          <div class="bus-shell">
            <div style="font-size:11px;color:var(--muted);border-bottom:1px dashed var(--border);padding-bottom:6px;">FRENTE · MOTORISTA (${trip.cls})</div>
            <div class="seat-grid">${gridHtml}</div>
          </div>
          <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <div style="font-size:11.5px;color:var(--muted);">Poltronas: <b class="mono">${state.selectedSeats.join(', ') || '—'}</b></div>
              <div class="mono" style="font-size:17px;font-weight:800;">R$ ${total}</div>
            </div>
            <button class="btn btn-primary" style="width:auto;" ${state.selectedSeats.length===0?'disabled':''} onclick="state.mobileScreen='checkout';render()">Continuar</button>
          </div>`;
      }

      if (state.mobileScreen === 'checkout') {
        return `
          <div class="card" style="background:var(--warning-soft);border-color:#fde68a;font-size:12px;color:#92400e;">
            ⏱ Assentos bloqueados temporariamente por <b class="mono">14:48</b>
          </div>
          <div class="card">
            <div style="font-size:12px;color:var(--muted);">RESUMO DA VIAGEM</div>
            <div style="font-weight:700;margin-top:2px;">${state.origin} → ${state.destination}</div>
            <div class="mono" style="font-size:12.5px;color:var(--muted);margin-top:4px;">Partida ${trip.dep} · Poltronas ${state.selectedSeats.join(', ')}</div>
            <div style="border-top:1px solid var(--border);margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;">
              <span>Total</span><b class="mono" style="color:var(--brand);font-size:17px;">R$ ${total}</b>
            </div>
          </div>
          <div class="card">
            <div style="font-size:12px;font-weight:700;margin-bottom:8px;">FORMA DE PAGAMENTO (SIMULADO)</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
              <button class="btn btn-outline" style="${state.paymentMethod==='PIX'?'border-color:var(--brand);color:var(--brand);':''}" onclick="state.paymentMethod='PIX';render()">PIX Instantâneo</button>
              <button class="btn btn-outline" style="${state.paymentMethod==='CARD'?'border-color:var(--brand);color:var(--brand);':''}" onclick="state.paymentMethod='CARD';render()">Cartão Crédito</button>
            </div>
            <button class="btn btn-primary" onclick="state.mobileScreen='ticket';render()">Finalizar compra simulada</button>
          </div>`;
      }

      return `
        <div class="card" style="border-top:4px solid var(--success);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span class="badge badge-success">CONFIRMADA</span>
            <span class="mono" style="font-weight:800;font-size:14px;">VJ-8F4K92</span>
          </div>
          <div style="font-weight:700;font-size:15px;">${state.origin} → ${state.destination}</div>
          <div class="mono" style="font-size:12.5px;color:var(--muted);margin:4px 0 12px;">28/11/2026 · ${trip.dep} · Poltronas: <b>${state.selectedSeats.join(', ')}</b></div>
          <div style="border-top:1px dashed var(--border);padding-top:14px;display:grid;place-items:center;gap:8px;">
            <svg width="112" height="112" viewBox="0 0 100 100" style="border:1px solid var(--border);padding:6px;border-radius:10px;background:#fff;">
              <rect x="8" y="8" width="26" height="26" fill="#0f172a"/><rect x="13" y="13" width="16" height="16" fill="#fff"/><rect x="17" y="17" width="8" height="8" fill="#0f172a"/>
              <rect x="66" y="8" width="26" height="26" fill="#0f172a"/><rect x="71" y="13" width="16" height="16" fill="#fff"/><rect x="75" y="17" width="8" height="8" fill="#0f172a"/>
              <rect x="8" y="66" width="26" height="26" fill="#0f172a"/><rect x="13" y="71" width="16" height="16" fill="#fff"/><rect x="17" y="75" width="8" height="8" fill="#0f172a"/>
              <rect x="42" y="12" width="8" height="8" fill="#0f172a"/><rect x="42" y="28" width="16" height="8" fill="#0f172a"/>
              <rect x="12" y="44" width="20" height="8" fill="#0f172a"/><rect x="42" y="44" width="16" height="16" fill="#1d4ed8"/>
              <rect x="66" y="44" width="22" height="8" fill="#0f172a"/><rect x="44" y="68" width="12" height="20" fill="#0f172a"/>
              <rect x="66" y="66" width="24" height="10" fill="#0f172a"/><rect x="74" y="82" width="16" height="10" fill="#0f172a"/>
            </svg>
            <span style="font-size:11.5px;color:var(--muted);">Apresente este QR Code ao motorista no embarque</span>
          </div>
        </div>`;
    }

    function renderWebScreen() {
      const override = renderStateFeedback();
      if (override && state.webScreen !== 'login') return override;

      if (state.webScreen === 'login') {
        return `
          <div style="max-width:380px;margin:48px auto;" class="card">
            <span class="badge badge-info" style="margin-bottom:10px;">ACESSO RESTRITO · ADMIN</span>
            <h2 style="font-size:20px;margin-bottom:14px;">VIAJA Control</h2>
            <div class="field"><label>E-mail corporativo</label><input class="input" value="admin@viaja.app" /></div>
            <div class="field"><label>Senha</label><input class="input" type="password" value="••••••••••" /></div>
            <button class="btn btn-primary" onclick="state.webScreen='dashboard';render()">Acessar painel</button>
          </div>`;
      }

      if (state.webScreen === 'dashboard') {
        return `
          <h2 style="font-size:20px;margin-bottom:16px;">Dashboard Operacional</h2>
          <div class="kpi-grid">
            <div class="card"><div style="font-size:12px;color:var(--muted);">Total de Viagens</div><div class="mono" style="font-size:24px;font-weight:800;margin-top:4px;">42</div></div>
            <div class="card"><div style="font-size:12px;color:var(--muted);">Total de Reservas</div><div class="mono" style="font-size:24px;font-weight:800;margin-top:4px;">318</div></div>
            <div class="card"><div style="font-size:12px;color:var(--muted);">Receita Simulada</div><div class="mono" style="font-size:24px;font-weight:800;color:var(--brand);margin-top:4px;">R$ 44.820</div></div>
            <div class="card"><div style="font-size:12px;color:var(--muted);">Taxa de Ocupação</div><div class="mono" style="font-size:24px;font-weight:800;color:var(--success);margin-top:4px;">76,4%</div></div>
          </div>
          <div class="card">
            <div style="font-weight:700;margin-bottom:12px;">Viagens Mais Procuradas (Ocupação)</div>
            <div style="display:flex;flex-direction:column;gap:10px;font-size:13px;">
              <div><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>São Paulo, SP ↔ Rio de Janeiro, RJ</span><b class="mono">88%</b></div><div style="height:8px;background:var(--surface-alt);border-radius:99px;"><div style="width:88%;height:100%;background:var(--brand);border-radius:99px;"></div></div></div>
              <div><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>São Paulo, SP ↔ Curitiba, PR</span><b class="mono">74%</b></div><div style="height:8px;background:var(--surface-alt);border-radius:99px;"><div style="width:74%;height:100%;background:var(--brand);border-radius:99px;"></div></div></div>
              <div><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>São Paulo, SP ↔ Belo Horizonte, MG</span><b class="mono">65%</b></div><div style="height:8px;background:var(--surface-alt);border-radius:99px;"><div style="width:65%;height:100%;background:var(--brand);border-radius:99px;"></div></div></div>
            </div>
          </div>`;
      }

      if (state.webScreen === 'routes') {
        return `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h2 style="font-size:20px;">Gerenciar Rotas</h2>
            <button class="btn btn-primary" style="width:auto;">+ Nova Rota</button>
          </div>
          <div class="card">
            <table>
              <thead><tr><th>Código</th><th>Origem</th><th>Destino</th><th>Distância</th><th>Duração Est.</th></tr></thead>
              <tbody>
                ${state.routes.map(r => `<tr><td class="mono">${r.id}</td><td>${r.origin}</td><td>${r.destination}</td><td class="mono">${r.km} km</td><td class="mono">${r.dur}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>`;
      }

      if (state.webScreen === 'trips') {
        return `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h2 style="font-size:20px;">Gerenciar Viagens</h2>
            <button class="btn btn-primary" style="width:auto;">+ Cadastrar Viagem</button>
          </div>
          <div class="card">
            <table>
              <thead><tr><th>Ônibus</th><th>Classe</th><th>Partida → Chegada</th><th>Preço</th><th>Assentos Livres</th><th>Status</th></tr></thead>
              <tbody>
                ${state.trips.map(t => `<tr><td>${t.company}</td><td>${t.cls}</td><td class="mono">${t.dep} → ${t.arr}</td><td class="mono">R$ ${t.price.toFixed(2).replace('.',',')}</td><td class="mono">${t.free}</td><td><span class="badge badge-success">SCHEDULED</span></td></tr>`).join('')}
              </tbody>
            </table>
          </div>`;
      }

      return `
        <h2 style="font-size:20px;margin-bottom:16px;">Consultar Reservas</h2>
        <div class="card">
          <table>
            <thead><tr><th>Localizador</th><th>Passageiro</th><th>Viagem</th><th>Assentos</th><th>Total</th><th>Pagamento</th><th>Status</th><th>Ação</th></tr></thead>
            <tbody>
              ${state.reservations.map(r => `
                <tr>
                  <td class="mono" style="font-weight:700;">${r.code}</td>
                  <td>${r.user}</td>
                  <td>${r.trip}</td>
                  <td class="mono">${r.seats}</td>
                  <td class="mono">${r.total}</td>
                  <td class="mono" style="font-size:12px;">${r.pay}</td>
                  <td><span class="badge ${r.status==='CONFIRMED'?'badge-success':r.status==='PENDING'?'badge-warning':'badge-danger'}">${r.status}</span></td>
                  <td>${r.status!=='CANCELLED' ? `<button class="btn btn-danger" onclick="cancelReservation('${r.code}')">Cancelar</button>` : '—'}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function render() {
      const steps = state.platform === 'mobile' ? mobileSteps : webSteps;
      const activeId = state.platform === 'mobile' ? state.mobileScreen : state.webScreen;

      document.getElementById('stepper').innerHTML = steps.map(s => `
        <button class="step-chip ${s.id === activeId ? 'active' : ''}"
          onclick="${state.platform === 'mobile' ? `state.mobileScreen='${s.id}'` : `state.webScreen='${s.id}'`};render()">
          ${s.label}
        </button>`).join('');

      const vp = document.getElementById('viewport');
      if (state.platform === 'mobile') {
        vp.innerHTML = `
          <div class="mobile-layout">
            <div class="phone-frame">
              <div class="phone-status"><span class="mono">09:41</span><span>5G · 100%</span></div>
              <div class="phone-header">
                <span style="font-weight:800;color:var(--brand);">VIAJA</span>
                <span style="font-size:12px;color:var(--muted);">${steps.find(s=>s.id===state.mobileScreen).label}</span>
              </div>
              <div class="phone-body">${renderMobileScreen()}</div>
              <div class="phone-nav">
                <button class="${['search','results','seats','checkout'].includes(state.mobileScreen)?'active':''}" onclick="state.mobileScreen='search';render()">Buscar</button>
                <button class="${state.mobileScreen==='ticket'?'active':''}" onclick="state.mobileScreen='ticket';render()">Passagens</button>
                <button class="${state.mobileScreen==='auth'?'active':''}" onclick="state.mobileScreen='auth';render()">Perfil</button>
              </div>
            </div>
            <div class="card">
              <h3 style="font-size:16px;margin-bottom:8px;">Notas de UX &amp; Regras desta Tela</h3>
              <ul style="padding-left:18px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px;">
                <li><b>Fluxo Navegável:</b> Clique nos cards de viagem, selecione/remova poltronas no mapa 2x2 e finalize o checkout simulado.</li>
                <li><b>Fonte da Verdade na API:</b> O mapa consulta <code>GET /api/trips/:id/seats</code>; assentos ocupados ficam desabilitados e conflitos concorrentes (<code>409</code>) atualizam o grid imediatamente.</li>
                <li><b>Estados Visuais:</b> Use o seletor no topo (<i>Normal, Loading, Empty, Error</i>) para validar todos os estados previstos no Passo 2.</li>
              </ul>
            </div>
          </div>`;
      } else {
        vp.innerHTML = `
          <div class="admin-shell">
            <aside class="admin-sidebar">
              <div style="font-weight:800;color:#fff;font-size:16px;padding:6px 12px 14px;">VIAJA Control</div>
              ${webSteps.map(s => `<button class="admin-nav-btn ${state.webScreen===s.id?'active':''}" onclick="state.webScreen='${s.id}';render()">${s.label}</button>`).join('')}
            </aside>
            <section class="admin-main">${renderWebScreen()}</section>
          </div>`;
      }
    }

    render();
  </script>
</body>
</html>
