name: VIAJA CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Verificação de Alterações (Monorepo Scope)
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect modified workspaces
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'packages/shared/**'
            backend:
              - 'backend/api/**'
            web:
              - 'apps/web/**'
            mobile:
              - 'apps/mobile/**'
            infra:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.github/workflows/**'

      - name: Publish change summary
        run: |
          echo "### Escopo detectado no Monorepo" >> $GITHUB_STEP_SUMMARY
          echo "- **@viaja/shared:** ${{ steps.filter.outputs.shared }}" >> $GITHUB_STEP_SUMMARY
          echo "- **@viaja/api:** ${{ steps.filter.outputs.backend }}" >> $GITHUB_STEP_SUMMARY
          echo "- **@viaja/web:** ${{ steps.filter.outputs.web }}" >> $GITHUB_STEP_SUMMARY
          echo "- **@viaja/mobile:** ${{ steps.filter.outputs.mobile }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Infraestrutura:** ${{ steps.filter.outputs.infra }}" >> $GITHUB_STEP_SUMMARY

  quality-and-unit:
    name: TypeScript, ESLint & Testes Unitários
    runs-on: ubuntu-latest
    needs: changes
    env:
      DATABASE_URL: postgresql://viaja:viaja_dev_password@localhost:5432/viaja_db?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @viaja/api run db:generate

      - name: Verify TypeScript across workspaces
        run: pnpm typecheck

      - name: Run ESLint
        run: pnpm lint

      - name: Check Prettier formatting
        run: pnpm format:check

      - name: Run Shared & Backend Unit Tests
        run: pnpm test:unit

      - name: Run Mobile Component & Telemetry Tests
        if: github.event_name == 'push' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.infra == 'true'
        run: pnpm --filter @viaja/mobile run test

      - name: Run Web Component & Form Tests
        if: github.event_name == 'push' || needs.changes.outputs.web == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.infra == 'true'
        run: pnpm --filter @viaja/web run test

  integration-tests:
    name: Testes de Integração & Concorrência (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: [changes, quality-and-unit]
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.infra == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viaja
          POSTGRES_PASSWORD: viaja_dev_password
          POSTGRES_DB: viaja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viaja -d viaja_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://viaja:viaja_dev_password@localhost:5432/viaja_test?schema=public
      TEST_DATABASE_URL: postgresql://viaja:viaja_dev_password@localhost:5432/viaja_test?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret-key-with-minimum-32-chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-key-with-minimum-32-chars
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client & Apply Migrations
        run: |
          pnpm --filter @viaja/api run db:generate
          pnpm --filter @viaja/api run db:migrate:deploy

      - name: Execute Supertest Integration & Seat Concurrency Suite
        run: pnpm test:integration

  build-web:
    name: Build da Aplicação Web (Next.js) & API
    runs-on: ubuntu-latest
    needs: [changes, quality-and-unit]
    if: github.event_name == 'push' || needs.changes.outputs.web == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.infra == 'true'
    env:
      DATABASE_URL: postgresql://viaja:viaja_dev_password@localhost:5432/viaja_db?schema=public
      NEXT_PUBLIC_API_URL: https://viaja-api.onrender.com/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client & Build Backend
        run: |
          pnpm --filter @viaja/api run db:generate
          pnpm --filter @viaja/api run build

      - name: Build Next.js Web Application
        run: pnpm --filter @viaja/web run build
