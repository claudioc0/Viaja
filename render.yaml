services:
  - type: web
    name: viaja-api
    runtime: docker
    dockerfilePath: ./backend/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3333
      - key: DATABASE_URL
        fromDatabase:
          name: viaja-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  - name: viaja-postgres
    databaseName: viaja_db
    user: viaja
    plan: basic-256mb
    postgresMajorVersion: '16'
